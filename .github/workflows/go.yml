name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: vet, test, frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Lint
        run: go vet ./...
    
      - name: Test
        run: go test ./...

      - name: Install frontend dependencies
        run: npm ci --prefix frontend/web

      - name: Check frontend
        run: npm run check --prefix frontend/web

      - name: Verify embedded frontend bundle
        run: git diff --exit-code -- frontend/web/dist
