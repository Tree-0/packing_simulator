workloads:
  - name: mostly-small
    simulation:
      container_height: 20
      container_width: 20
      queue_size: 5
      min_box_height: 1
      max_box_height: 3
      min_box_width: 1
      max_box_width: 3
      iterations: 100
      allow_box_rotation: true

  - name: mostly-large
    simulation:
      container_height: 20
      container_width: 20
      queue_size: 5
      min_box_height: 3
      max_box_height: 5
      min_box_width: 3
      max_box_width: 5
      iterations: 100
      allow_box_rotation: true

  - name: flat-boxes
    simulation:
      container_height: 20
      container_width: 20
      queue_size: 5
      min_box_height: 1
      max_box_height: 1
      min_box_width: 1
      max_box_width: 10
      iterations: 100
      allow_box_rotation: true

seeds: [42, 43, 44]
policies:
  - bottom-left
  - largest-area-bottom-left

evaluators:
  - utilization
  - fragmentation

workers: 0