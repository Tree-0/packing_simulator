workloads:
  - name: online
    simulation:
      container_height: 10
      container_width: 10
      queue_size: 1
      min_box_height: 1
      max_box_height: 5
      min_box_width: 1
      max_box_width: 5
      iterations: 50
      allow_box_rotation: true

  - name: offline
    simulation:
      container_height: 10
      container_width: 10
      queue_size: 50
      min_box_height: 1
      max_box_height: 5
      min_box_width: 1
      max_box_width: 5
      iterations: 50
      allow_box_rotation: false

max_containers: -1

seeds: [10, 11, 12]
policies:
  - bottom-left
  - largest-area-bottom-left

container_selectors:
  - name: first-fit
  - name: next-fit

evaluators:
  - utilization
  - fragmentation
  - area-weighted-fragmentation
  - future-fit-probability
  - compactness

workers: 0
