workloads:
  - name: can_rotate
    simulation:
      container_height: 15
      container_width: 15
      queue_size: 5
      min_box_height: 1
      max_box_height: 5
      min_box_width: 1
      max_box_width: 5
      iterations: 100
      allow_box_rotation: true

  - name: cannot_rotate
    simulation:
      container_height: 15
      container_width: 15
      queue_size: 5
      min_box_height: 1
      max_box_height: 5
      min_box_width: 1
      max_box_width: 5
      iterations: 100
      allow_box_rotation: false

max_containers: -1

seeds: [314159265]
policies:
  - bottom-left
  - largest-area-bottom-left

container_selectors:
  - name: first-fit
  - name: next-fit

evaluators:
  - utilization
  - fragmentation
  - future-fit-probability

workers: 0
