simulation:
  container_height: 20
  container_width: 20
  queue_size: 5
  min_box_height: 1
  max_box_height: 4
  min_box_width: 1
  max_box_width: 4
  iterations: 50

seeds: [42, 43, 44, 45]
policies:
  - bottom-left
  - largest-area-bottom-left

evaluators:
  - utilization
  - fragmentation
  - area-weighted-fragmentation
  - compactness
  - future-fit-probability

workers: 0 # 0 = use GOMAXPROCS